<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>视觉跟随</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#15151a;color:#e1e1e4;font:14px/1.4 sans-serif}body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}button,input{font:inherit;color:inherit;background:#33333b;border:1px solid #50505c;border-radius:5px}button{min-height:44px;padding:8px;touch-action:manipulation}button:disabled{opacity:.55}button:focus-visible{outline:2px solid #a78bfa}#workspace{height:100%;display:grid;grid-template-columns:210px minmax(0,1fr);gap:8px;padding:8px}#controls{background:#242429;border-radius:7px;padding:8px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:12px}#motionActions{display:flex;gap:6px}#motionActions>*{flex:1;min-width:0}#toggleFollow{padding:6px 2px;white-space:nowrap}

  font:inherit;color:inherit;background:#33333b;border:1px solid #50505c;border-radius:5px}
</style></head><body><div id="workspace"><aside id="controls"><button id="returnNavigation" type="button">返回导航</button><div id="motionActions"><button id="toggleFollow" type="button" aria-pressed="false">底盘跟随</button>
