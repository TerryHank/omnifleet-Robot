collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_muxed
    cmd_vel_out_topic: /cmd_vel
    transform_tolerance: 0.5
    source_timeout: 1.0
    base_shift_correction: false
    stop_pub_timeout: 1.0
    polygons:
    - EmergencyStop
    EmergencyStop:
      type: polygon
      points:
      - 0.85
      - 0.28
      - 0.85
      - -0.28
      - -0.22
      - -0.28
      - -0.22
      - 0.28
      action_type: stop
      max_points: 3
      visualize: true
      polygon_pub_topic: EmergencyStop
      enabled: true
    observation_sources:
    - lidar
    lidar:
      type: pointcloud
      topic: /navigation/deskewed_points
      min_height: 0.02
      max_height: 0.8
      enabled: true
