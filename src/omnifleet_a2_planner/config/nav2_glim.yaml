bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 100
    default_server_timeout: 5000
    always_reload_bt_xml: true
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_recovery_node_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_rate_controller_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    # 10 Hz is sufficient for this chassis and leaves CPU headroom for localization.
    controller_frequency: 10.0
    "controller_server.verbose": false
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # Keep a transient optimizer miss from aborting an otherwise valid navigation task.
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.35
      movement_time_allowance: 12.0
    general_goal_checker:
      # 阿克曼车辆不能原地修正朝向，因此必须持续同时检查位置和朝向，
      # 不能在首次进入位置容差后永久锁定XY成功。
      stateful: false
      plugin: "nav2_controller::SimpleGoalChecker"
      # The rolling chassis needs enough distance to finish braking.
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.25
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 12.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.50
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Measured real chassis envelope: 0.51 m long x 0.32 m wide.
      # base_link is the rear-axle midpoint, so preserve the verified +0.42 m
      # front extent and extend the rear extent to -0.09 m.
      footprint: "[[-0.09, -0.16], [-0.09, 0.16], [0.42, 0.16], [0.42, -0.16]]"
      # The measured 0.51 x 0.32 m polygon is the complete collision envelope.
      footprint_padding: 0.0
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        # Use the full Nav2 obstacle-height baseline; handle self-reflection separately.
        max_obstacle_height: 2.0
        observation_sources: lidar
        lidar:
          topic: /rslidar_points
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.12
          obstacle_max_range: 6.0
          obstacle_min_range: 0.12
          min_obstacle_height: -0.03
          max_obstacle_height: 2.0
          observation_persistence: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.45
      # Foxglove consumes OccupancyGrid, not Costmap2D incremental updates.
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      # Keep the global planner on the same live Airy obstacle snapshot cadence
      # as the controller; otherwise a path can be stale before RPP receives it.
      update_frequency: 10.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.50
      footprint: "[[-0.09, -0.16], [-0.09, 0.16], [0.42, 0.16], [0.42, -0.16]]"
      footprint_padding: 0.0
      resolution: 0.05
      rolling_window: false
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        # Match the local controller's full obstacle-height baseline.
        max_obstacle_height: 2.0
        observation_sources: lidar
        lidar:
          topic: /rslidar_points
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.12
          obstacle_max_range: 6.0
          obstacle_min_range: 0.12
          min_obstacle_height: -0.03
          max_obstacle_height: 2.0
          observation_persistence: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.45
      # Publish a current full grid for Foxglove at the configured 0.5 Hz.
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72
      # Attempt direct goal connections less aggressively, and keep the
      # maximum length at roughly five times the physical turning radius.
      analytic_expansion_ratio: 5.0
      analytic_expansion_max_length: 4.0
      minimum_turning_radius: 1.35
      # Preserve reverse as an escape option, but prefer a forward curve when
      # both directions are collision-free.
      reverse_penalty: 4.0
      change_penalty: 0.2
      non_straight_penalty: 1.2
      cost_penalty: 2.5
      retrospective_penalty: 0.015
      lookup_table_size: 5.0
      cache_obstacle_heuristic: true
      # Use Smac's built-in, footprint-aware post-processing. There is no
      # separate smoother_server in the production chain.
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
