controller_server:
  ros__parameters:
    # MPPI的模型步长必须与控制周期一致；只在controller_mode=mppi时升至20 Hz。
    controller_frequency: 20.0
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      # Orange Pi边建图边导航的保守采样规模；关闭轨迹可视化降低CPU和DDS负载。
      batch_size: 500
      iteration_count: 1
      visualize: false
      regenerate_noises: false

      vx_std: 0.20
      vy_std: 0.0
      wz_std: 0.35
      vx_max: 0.40
      vx_min: -0.40
      vy_max: 0.0
      wz_max: 0.64
      ax_max: 0.80
      ax_min: -0.80
      ay_max: 0.0
      ay_min: 0.0
      az_max: 1.20

      prune_distance: 1.70
      transform_tolerance: 0.50
      temperature: 0.30
      gamma: 0.015
      motion_model: "Ackermann"
      enforce_path_inversion: true
      inversion_xy_tolerance: 0.20
      inversion_yaw_tolerance: 0.40
      AckermannConstraints:
        min_turning_r: 1.35

      critics:
        - "ConstraintCritic"
        - "CostCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
        - "PreferForwardCritic"
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 4
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.40
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.50
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        max_path_occupancy_ratio: 0.10
        trajectory_point_step: 4
        threshold_to_consider: 0.50
        offset_from_furthest: 20
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.40
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        offset_from_furthest: 4
        threshold_to_consider: 0.50
        max_angle_to_furthest: 1.0
        # 按Hybrid-A*路径姿态判定前进/倒车，避免在换向点两侧来回争抢。
        mode: 2
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.50
