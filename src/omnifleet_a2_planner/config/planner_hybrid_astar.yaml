planner_server:
  ros__parameters:
    # Try the simple continuous forward solution first. Only fall back to
    # Reeds-Shepp when the footprint and turning radius make it impossible.
    planner_plugins: ["ForwardGrid", "GridBased"]
    ForwardGrid:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 5.0
      analytic_expansion_max_length: 4.0
      minimum_turning_radius: 1.35
      reverse_penalty: 4.0
      change_penalty: 0.2
      non_straight_penalty: 1.2
      cost_penalty: 2.5
      retrospective_penalty: 0.015
      lookup_table_size: 5.0
      cache_obstacle_heuristic: true
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
    GridBased:
      # Hybrid-A* + Reeds-Shepp fallback preserves escape-by-reversing.
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      motion_model_for_search: "REEDS_SHEPP"
