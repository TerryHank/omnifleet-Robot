# Airy三维点云的STVL局部障碍模式。
local_costmap:
  local_costmap:
    ros__parameters:
      plugins: [stvl_layer, inflation_layer]
      stvl_layer:
        plugin: spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer
        enabled: true
        voxel_size: 0.05
        voxel_decay: 15.0
        decay_model: 0
        track_unknown_space: true
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: -0.05
        publish_voxel_map: false
        transform_tolerance: 0.5
        mapping_mode: false
        observation_sources: lidar_mark lidar_clear
        lidar_mark:
          topic: /rslidar_points
          data_type: PointCloud2
          marking: true
          clearing: false
          obstacle_range: 6.0
          min_obstacle_height: -0.03
          max_obstacle_height: 0.80
          expected_update_rate: 0.0
          observation_persistence: 0.0
          filter: voxel
          voxel_min_points: 0
          clear_after_reading: true
        lidar_clear:
          topic: /rslidar_points
          data_type: PointCloud2
          marking: false
          clearing: true
          max_z: 8.0
          min_z: 0.10
          vertical_fov_angle: 1.05
          vertical_fov_padding: 0.05
          horizontal_fov_angle: 6.29
          decay_acceleration: 0.0
          model_type: 1
