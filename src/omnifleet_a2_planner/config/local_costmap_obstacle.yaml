# 默认局部障碍模式：由Nav2官方ObstacleLayer直接处理Airy原始点云。
local_costmap:
  local_costmap:
    ros__parameters:
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        # Use the full Nav2 obstacle-height baseline; handle self-reflection separately.
        max_obstacle_height: 2.0
        observation_sources: lidar
        lidar:
          topic: /rslidar_points
          clearing: true
          marking: true
          data_type: PointCloud2
          raytrace_max_range: 8.0
          raytrace_min_range: 0.12
          obstacle_max_range: 6.0
          obstacle_min_range: 0.12
          min_obstacle_height: -0.03
          max_obstacle_height: 2.0
          observation_persistence: 0.0
