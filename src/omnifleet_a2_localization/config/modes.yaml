schema_version: 1
modes:
  glim_cuda:
    launch_package: omnifleet_a2_localization
    launch_file: glim_cuda_backend.launch.py
    operations: [mapping, localization, slam_navigation]
    required_topics: [/rslidar_points, /rslidar_imu_data]
    required_outputs: [/glim_ros/odom, /odom]
    operation_required_outputs:
      localization: [/map]
      slam_navigation: [/map]
    map_to_odom_owner: glim_ros
    odom_to_base_owner: glim_ros
    odom_message_owner: omnifleet_a2_glim_odom_adapter
    navigation_capable: true
    navigation_operations: [localization, slam_navigation]
    shutdown_timeout_sec: 30.0
    environment_setup: ~/slam_overlays/glim_cuda_ws/setup_glim_cuda.bash
    software_versions:
      omnifleet_a2_localization: "0.3.0"
      glim: "1.2.2"
  cartographer_3d:
    launch_package: omnifleet_a2_localization
    launch_file: cartographer_3d_backend.launch.py
    operations: [mapping, slam_navigation]
    required_topics:
      [/rslidar_points, /rslidar_imu_data_corrected, /omnifleet_a2/chassis/wheel_odometry]
    required_outputs: [/submap_list, /odom]
    operation_required_outputs:
      mapping: [/map]
      slam_navigation: [/map]
    map_to_odom_owner: cartographer_node
    odom_to_base_owner: cartographer_node
    odom_message_owner: omnifleet_a2_cartographer_odom_adapter
    navigation_capable: true
    navigation_operations: [slam_navigation]
    shutdown_timeout_sec: 30.0
    required_saved_artifacts: [map.pbstream]
    software_versions:
      omnifleet_a2_localization: "0.3.0"
      cartographer: "2.0.9004"
      cartographer_ros: "2.0.9002"
  mola:
    launch_package: omnifleet_a2_localization
    launch_file: mola_backend.launch.py
    operations: [mapping, slam_navigation]
    required_topics: [/rslidar_points]
    required_outputs: [/odom]
    operation_required_outputs:
      mapping: [/map]
      slam_navigation: [/map]
    map_to_odom_owner: mola_bridge_ros2
    odom_to_base_owner: omnifleet_a2_driver
    odom_message_owner: omnifleet_a2_driver
    navigation_capable: true
    navigation_operations: [slam_navigation]
    shutdown_timeout_sec: 30.0
    required_saved_artifacts: [local_map.mm]
    software_versions:
      omnifleet_a2_localization: "0.3.0"
      mola_lidar_odometry: "3.0.0"
      mola_launcher: "3.0.0"
      mola_kernel: "3.0.0"
      mola_bridge_ros2: "3.0.0"
