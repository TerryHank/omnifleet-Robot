common:
  msg_source: 1
  send_packet_ros: false
  send_point_cloud_ros: true
lidar:
- driver:
    lidar_type: RSAIRY
    airy_output_channels: 32
    split_frame_mode: 3
    num_blks_split: 900
    split_angle: 0.0
    msop_port: 6699
    difop_port: 7788
    imu_port: 6688
    host_address: 192.168.1.5
    socket_recv_buf: 10485760
    user_layer_bytes: 0
    tail_layer_bytes: 0
    min_distance: 0.2
    max_distance: 200.0
    use_lidar_clock: false
    dense_points: false
    ts_first_point: true
    wait_for_difop: true
    start_angle: 0.0
    end_angle: 360.0
    pcap_repeat: true
    pcap_rate: 1.0
    pcap_path: /home/robosense/lidar.pcap
  ros:
    ros_frame_id: rslidar
    ros_recv_packet_topic: /rslidar_packets
    ros_send_packet_topic: /rslidar_packets
    ros_send_imu_data_topic: /rslidar_imu_data
    ros_send_point_cloud_topic: /rslidar_points
    ros_send_imu_raw_topic: /rslidar_imu_data_raw
    imu_kalman_enabled: false
    ros_queue_length: 5
