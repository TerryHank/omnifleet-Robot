collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "/cmd_vel_muxed"
    cmd_vel_out_topic: "/cmd_vel"
    transform_tolerance: 0.50
    source_timeout: 0.5
    base_shift_correction: false
    stop_pub_timeout: 1.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      points: [0.30, 0.20, 0.30, -0.20, -0.28, -0.20, -0.28, 0.20]
      action_type: "approach"
      time_before_collision: 1.5
      simulation_time_step: 0.1
      max_points: 10
      visualize: true
      polygon_pub_topic: "FootprintApproach"
      enabled: true
    observation_sources: ["lidar"]
    lidar:
      type: "pointcloud"
      topic: "/lidar/obstacles"
      min_height: 0.02
      max_height: 0.80
      enabled: true
