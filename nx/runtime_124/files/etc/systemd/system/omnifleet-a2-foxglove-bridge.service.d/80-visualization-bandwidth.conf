[Service]
ExecStart=
ExecStart=/bin/bash -lc 'source /opt/ros/$ROS_DISTRO/setup.bash && source $OMNIFLEET_A2_SENSOR_WS/install/setup.bash && source $OMNIFLEET_A2_WS/install/setup.bash && exec ros2 run foxglove_bridge foxglove_bridge --ros-args -r __node:=omnifleet_a2_foxglove_bridge --params-file /etc/omnifleet_a2/foxglove.yaml -p address:=$OMNIFLEET_A2_FOXGLOVE_ADDRESS -p port:=$OMNIFLEET_A2_FOXGLOVE_PORT -r /map:=/visualization/foxglove_map -r /global_costmap/costmap:=/visualization/foxglove_global_costmap -r /navigation/deskewed_points:=/visualization/foxglove_deskewed_points'
