[Service]
# robot_101 is the only production unit allowed to use this fixed 32-channel profile.
# Fail closed before the driver starts if the robot-specific config is missing or not 32.
ExecStartPre=/usr/bin/test -f /home/iecme/omnifleet_ws/src/sensing/rslidar_sdk/config/config.yaml
ExecStartPre=/usr/bin/grep -qE '^[[:space:]]*lidar_type:[[:space:]]*RSAIRY' /home/iecme/omnifleet_ws/src/sensing/rslidar_sdk/config/config.yaml
ExecStartPre=/usr/bin/grep -qE '^[[:space:]]*airy_output_channels:[[:space:]]*32([[:space:]]|$)' /home/iecme/omnifleet_ws/src/sensing/rslidar_sdk/config/config.yaml
