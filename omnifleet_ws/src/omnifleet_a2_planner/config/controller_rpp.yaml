controller_server:
  ros__parameters:
    controller_frequency: 10.0
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 1.0
      # Follow tight Hybrid-A* bends without cutting across the inside obstacle.
      lookahead_dist: 0.45
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.60
      lookahead_time: 1.00
      transform_tolerance: 0.50
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.18
      approach_velocity_scaling_dist: 1.1
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      # Must not exceed the 0.45 m costmap inflation radius.
      cost_scaling_dist: 0.30
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 11.0
      regulated_linear_scaling_min_radius: 1.35
      # Calibrated vehicle radius used for feasible steering and collision projection.
      minimum_turning_radius: 1.15
      # Full-lock measured 17.8 deg left and 16.3 deg right at 55 deg servo travel.
      steering_actuator_ratio: 3.10
      right_steering_actuator_ratio: 3.37
      # Minimum speed the chassis can sustain during low-speed tracking.
      regulated_linear_scaling_min_speed: 0.18
      use_rotate_to_heading: false
      allow_reversing: true
