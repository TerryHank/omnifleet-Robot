[Unit]
Description=OmniFleet T2 Ranger Mini 3.0 CAN chassis

[Service]
RuntimeDirectory=omnifleet-ranger-can
ExecStartPre=
ExecStartPre=+/bin/bash /home/iecme/omnifleet_ws/src/vehicle/ranger_can/setup_listen.sh
ExecStart=
ExecStart=/bin/bash -c 'source /home/iecme/omnifleet_ws/src/system/workspace_support/robot_fleet_env.bash && exec /usr/bin/python3 /home/iecme/omnifleet_ws/src/vehicle/ranger_can/can_receiver.py'
