[Unit]
Description=OmniFleet T2 Ranger Mini 3.0 ROS 2 SDK

[Service]
ExecStartPre=
ExecStartPre=+/bin/bash /home/iecme/omnifleet_ws/src/vehicle/ranger_can/setup_listen.sh off
ExecStart=
ExecStart=/bin/bash -c 'source /home/iecme/omnifleet_ws/src/system/workspace_support/robot_fleet_env.bash && source /home/iecme/omnifleet_ws/install/ranger_ros2/local_setup.bash && exec ros2 launch /home/iecme/omnifleet_ws/src/vehicle/ranger_can/config/ranger104.launch.py port_name:=$(cat /run/omnifleet-ranger-can/interface)'
Restart=always
